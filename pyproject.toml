[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "multi-vendor-infrastructure-automation"
version = "0.2.0"
description = "Read-only multi-vendor infrastructure discovery and drift analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "berkeleyo"}]
dependencies = [
  "defusedxml>=0.7,<1",
  "dnspython>=2.7,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
azure = ["azure-identity>=1.19,<2", "azure-mgmt-network>=28,<30"]
dev = ["mypy>=1.13,<2", "pytest>=9.0.3,<10", "pytest-cov>=6,<8", "respx>=0.22,<1", "ruff>=0.8,<1", "types-PyYAML>=6.0"]

[project.scripts]
mvia = "mvia.cli:main"
mvia-api = "mvia.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mvia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mvia"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=mvia --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]


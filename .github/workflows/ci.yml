name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PIP_BUILD_CONSTRAINT: constraints-ci.txt
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install --constraint constraints-ci.txt -e '.[dev,aws,azure]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: mvia drift --config examples/offline.yaml --desired examples/desired.yaml
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install --constraint constraints-ci.txt -e '.[aws,azure]' pip-audit==2.10.1
      - run: pip-audit --local
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

